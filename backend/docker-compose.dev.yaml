version: '3.7'

# Legacy file - kept for backward compatibility
# Use root-level docker-compose.dev.yaml for integrated development
# Or use this file for standalone backend development

services:
  ebs:
    container_name: easy-banking-service-ebs-standalone
    build:
      target: dev
      context: ../
      dockerfile: backend/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../backend:/app:rw
    environment:
      PHP_IDE_CONFIG: serverName=ebs-standalone
    depends_on:
      postgres_dev:
        condition: service_healthy
    networks:
      - backend-standalone-network

  nginx:
    image: nginx:alpine
    container_name: easy-banking-service-nginx-standalone
    ports:
      - "8080:80"
    volumes:
      - ../backend/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend:/app:rw
    depends_on:
      - ebs
    networks:
      - backend-standalone-network

  postgres_dev:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: easy-banking-service-postgres-standalone
    ports:
      - "54322:5432"
    volumes:
      - ../backend/docker/postgres:/docker-entrypoint-initdb.d
      - postgres_standalone_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      POSTGRES_MULTIPLE_DATABASES: ebsdatabase_dev
      POSTGRES_PASSWORD: postgres
      TZ: "CET"
      PGTZ: "CET"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - backend-standalone-network

networks:
  backend-standalone-network:
    driver: bridge
    name: backend-standalone-network

volumes:
  postgres_standalone_data:
